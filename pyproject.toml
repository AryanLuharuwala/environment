[project]
name = "ale"
version = "0.1.0"
description = "Agentic Learning Environment - multi-agent playground + RL benchmark suite for Claude"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40.0",
]

[project.scripts]
ale = "ale.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ale*"]
