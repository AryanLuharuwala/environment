[project]
name = "ale"
version = "0.2.0"
description = "Agentic Learning Environment - multi-agent playground + RLAIF pipeline for Claude and OpenAI-format backends"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40.0",
]

[project.optional-dependencies]
openai = ["openai>=1.40.0"]
train = [
    "torch>=2.2",
    "transformers>=4.44",
    "trl>=0.12",
    "peft>=0.13",
    "datasets>=2.20",
]
forge-embed = ["sentence-transformers>=3"]

[project.scripts]
ale = "ale.cli:main"
forge = "forge.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ale*", "forge*"]
